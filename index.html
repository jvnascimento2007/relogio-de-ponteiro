<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio</title>
</head>
<body>
    <main>
        <h1>Relógio de Ponteiro</h1>
        <div id="time-control">
            <button id="time-backward">&lt;</button>
            <p id="hour-minute-second"></p>
            <button id="time-forward">&gt;</button>
            <button id="time-mode">SEGUNDOS</button>
        </div>
        <canvas id="canvas" width="300" height="300">Conteúdo não suportado pelo navegador!</canvas>
    </main>
    <script type="module" src="src/main.js"></script>
</body>
</html>
